<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EasyClash</title>
    <link rel="icon" href="./src/assets/images/favicon.ico" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('easy-clash-theme') === 'light' ||
          localStorage.getItem('simple-proxy-theme') === 'light'
            ? 'light'
            : 'dark'
      } catch (e) {}
    </script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
