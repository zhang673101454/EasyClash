# EasyClash 内置极简配置。API 仅绑定本机，切勿改为 0.0.0.0。
# 智能分流：GEOSITE/GEOIP 识别国内直连，其余走代理；geodata 随安装包内置，无需在线下载。
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
geodata-mode: true
geo-auto-update: false

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - geosite:cn
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
